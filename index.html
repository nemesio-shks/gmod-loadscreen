<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>NEXUS REBORN</title>
<style>
@font-face{font-family:'Orbitron';font-weight:500;src:url(fonts/orbitron-500.ttf) format('truetype')}
@font-face{font-family:'Orbitron';font-weight:900;src:url(fonts/orbitron-900.ttf) format('truetype')}
@font-face{font-family:'Exo2';font-weight:400;src:url(fonts/exo2-400.ttf) format('truetype')}
@font-face{font-family:'Exo2';font-weight:600;src:url(fonts/exo2-600.ttf) format('truetype')}

*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;color:#dff6ff;font-family:'Exo2',"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none}
.abs{position:absolute;left:0;top:0;width:100%;height:100%}
:root{--c1:#00e5ff;--c2:#7a5cff;--c3:#ff2e88}

/* ---------- ФОН ---------- */
#slides .slide{position:absolute;left:-5%;top:-5%;width:110%;height:110%;background-size:cover;background-position:center;opacity:0;
 -webkit-transition:opacity 2.5s ease;transition:opacity 2.5s ease}
#slides .slide.on{opacity:.5;-webkit-animation:kb 14s linear forwards;animation:kb 14s linear forwards}
@-webkit-keyframes kb{from{-webkit-transform:scale(1) translate(0,0)}to{-webkit-transform:scale(1.12) translate(-2%,-1%)}}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.12) translate(-2%,-1%)}}
#tint{background:radial-gradient(ellipse at 50% 45%,rgba(0,30,60,.15),rgba(0,0,0,.8) 80%),linear-gradient(180deg,rgba(0,10,25,.25),rgba(0,0,0,.6))}
#glow{background:radial-gradient(circle at 15% 20%,rgba(0,229,255,.18),transparent 40%),radial-gradient(circle at 85% 80%,rgba(122,92,255,.2),transparent 45%);
 -webkit-animation:glowmove 12s ease-in-out infinite alternate;animation:glowmove 12s ease-in-out infinite alternate}
@-webkit-keyframes glowmove{to{-webkit-transform:translate(3%,-3%) scale(1.1)}}
@keyframes glowmove{to{transform:translate(3%,-3%) scale(1.1)}}
#grid{top:58%;height:80%;left:-50%;width:200%;opacity:.35;
 background-image:linear-gradient(rgba(0,229,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.5) 1px,transparent 1px);background-size:60px 60px;
 -webkit-transform:perspective(400px) rotateX(70deg);transform:perspective(400px) rotateX(70deg);-webkit-transform-origin:top;transform-origin:top;
 -webkit-mask-image:linear-gradient(180deg,transparent,#000 40%);mask-image:linear-gradient(180deg,transparent,#000 40%);
 -webkit-animation:gridmove 3s linear infinite;animation:gridmove 3s linear infinite}
@-webkit-keyframes gridmove{to{background-position:0 60px}}
@keyframes gridmove{to{background-position:0 60px}}
#scan{pointer-events:none;background:repeating-linear-gradient(180deg,rgba(255,255,255,.03) 0,rgba(255,255,255,.03) 1px,transparent 1px,transparent 3px);z-index:50}
#scanbar{pointer-events:none;height:120px;top:-120px;background:linear-gradient(180deg,transparent,rgba(0,229,255,.06),transparent);z-index:51;
 -webkit-animation:scanbar 7s linear infinite;animation:scanbar 7s linear infinite}
@-webkit-keyframes scanbar{to{top:110%}}
@keyframes scanbar{to{top:110%}}
.p{position:absolute;width:2px;height:2px;background:var(--c1);border-radius:50%;box-shadow:0 0 6px var(--c1);
 -webkit-animation:rise linear infinite;animation:rise linear infinite}
@-webkit-keyframes rise{from{-webkit-transform:translateY(0);opacity:0}10%{opacity:1}90%{opacity:1}to{-webkit-transform:translateY(-110vh);opacity:0}}
@keyframes rise{from{transform:translateY(0);opacity:0}10%{opacity:1}90%{opacity:1}to{transform:translateY(-110vh);opacity:0}}

/* ---------- ИНТРО ---------- */
#intro{z-index:100;background:#000;display:block}
#intro.out{-webkit-animation:introout 1.1s ease forwards;animation:introout 1.1s ease forwards}
@-webkit-keyframes introout{to{opacity:0;-webkit-transform:scale(1.25);visibility:hidden}}
@keyframes introout{to{opacity:0;transform:scale(1.25);visibility:hidden}}
#intro .wrap{position:absolute;left:0;right:0;top:50%;margin-top:-90px;text-align:center}
#iNexus{font-family:'Orbitron';font-weight:900;font-size:150px;letter-spacing:22px;line-height:1;color:#fff;padding-left:22px}
#iNexus span{display:inline-block;opacity:0;-webkit-animation:letter .9s cubic-bezier(.2,.8,.2,1) forwards;animation:letter .9s cubic-bezier(.2,.8,.2,1) forwards;
 text-shadow:0 0 20px rgba(0,229,255,.9),0 0 60px rgba(0,229,255,.5)}
@-webkit-keyframes letter{0%{opacity:0;-webkit-transform:translateY(40px) scale(1.6);-webkit-filter:blur(12px)}
 40%{opacity:1;text-shadow:-6px 0 rgba(255,46,136,.9),6px 0 rgba(0,229,255,.9)}
 55%{opacity:.3}65%{opacity:1}
 100%{opacity:1;-webkit-transform:none;-webkit-filter:blur(0)}}
@keyframes letter{0%{opacity:0;transform:translateY(40px) scale(1.6);filter:blur(12px)}
 40%{opacity:1;text-shadow:-6px 0 rgba(255,46,136,.9),6px 0 rgba(0,229,255,.9)}
 55%{opacity:.3}65%{opacity:1}
 100%{opacity:1;transform:none;filter:blur(0)}}
#iLine{height:2px;width:0;margin:22px auto 18px;background:linear-gradient(90deg,transparent,var(--c1),#fff,var(--c1),transparent);box-shadow:0 0 18px var(--c1);
 -webkit-animation:line .9s 1.5s ease forwards;animation:line .9s 1.5s ease forwards}
@-webkit-keyframes line{to{width:62%}}
@keyframes line{to{width:62%}}
#iReborn{font-family:'Orbitron';font-weight:500;font-size:34px;color:var(--c1);opacity:0;letter-spacing:60px;padding-left:60px;
 text-shadow:0 0 14px var(--c1);-webkit-animation:reborn 1.4s 2.1s cubic-bezier(.2,.8,.2,1) forwards;animation:reborn 1.4s 2.1s cubic-bezier(.2,.8,.2,1) forwards}
@-webkit-keyframes reborn{to{opacity:1;letter-spacing:18px;padding-left:18px}}
@keyframes reborn{to{opacity:1;letter-spacing:18px;padding-left:18px}}
#iFlash{background:#fff;opacity:0;-webkit-animation:flash .6s 1.35s ease-out;animation:flash .6s 1.35s ease-out}
@-webkit-keyframes flash{0%{opacity:0}15%{opacity:.35}100%{opacity:0}}
@keyframes flash{0%{opacity:0}15%{opacity:.35}100%{opacity:0}}

/* ---------- ОСНОВНОЙ ЭКРАН ---------- */
#main{opacity:0;-webkit-transition:opacity 1.2s;transition:opacity 1.2s}
#main.on{opacity:1}
.corner{position:absolute;width:46px;height:46px;border:2px solid var(--c1);opacity:.7;box-shadow:0 0 10px rgba(0,229,255,.4)}
.c1{left:24px;top:24px;border-right:0;border-bottom:0}.c2{right:24px;top:24px;border-left:0;border-bottom:0}
.c3{left:24px;bottom:24px;border-right:0;border-top:0}.c4{right:24px;bottom:24px;border-left:0;border-top:0}

#logo{position:absolute;left:0;right:0;top:24%;text-align:center}
#lNexus{font-family:'Orbitron';font-weight:900;font-size:120px;letter-spacing:18px;padding-left:18px;color:#fff;line-height:1;position:relative;display:inline-block;
 text-shadow:0 0 25px rgba(0,229,255,.8),0 0 70px rgba(0,229,255,.35)}
#lNexus.glitch{-webkit-animation:glitch .35s steps(2) 1;animation:glitch .35s steps(2) 1}
@-webkit-keyframes glitch{0%{text-shadow:-8px 0 var(--c3),8px 0 var(--c1);-webkit-transform:translate(4px,-2px) skewX(-8deg)}
 50%{text-shadow:8px 0 var(--c3),-8px 0 var(--c1);-webkit-transform:translate(-4px,2px) skewX(6deg)}100%{-webkit-transform:none}}
@keyframes glitch{0%{text-shadow:-8px 0 var(--c3),8px 0 var(--c1);transform:translate(4px,-2px) skewX(-8deg)}
 50%{text-shadow:8px 0 var(--c3),-8px 0 var(--c1);transform:translate(-4px,2px) skewX(6deg)}100%{transform:none}}
#lReborn{font-family:'Orbitron';font-weight:500;font-size:28px;letter-spacing:18px;padding-left:18px;color:var(--c1);margin-top:14px;text-shadow:0 0 12px var(--c1)}
#lName{margin-top:22px;font-size:17px;letter-spacing:3px;opacity:.7;text-transform:uppercase}

#chips{position:absolute;left:0;right:0;bottom:170px;text-align:center}
.chip{display:inline-block;margin:0 8px;padding:9px 20px 9px 16px;background:rgba(0,20,35,.55);border:1px solid rgba(0,229,255,.3);border-left:3px solid var(--c1);
 font-size:15px;-webkit-clip-path:polygon(0 0,100% 0,100% 70%,92% 100%,0 100%);clip-path:polygon(0 0,100% 0,100% 70%,92% 100%,0 100%)}
.chip b{font-family:'Exo2';font-weight:600;color:var(--c1);font-size:11px;letter-spacing:2px;margin-right:8px;opacity:.85}

#load{position:absolute;left:10%;right:10%;bottom:86px}
#loadTop{overflow:hidden;margin-bottom:10px;font-size:14px}
#status{float:left;max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
#status:before{content:"> ";color:var(--c1)}
#pct{float:right;font-family:'Orbitron';font-weight:900;color:var(--c1);font-size:18px;text-shadow:0 0 10px var(--c1)}
#bar{position:relative;height:10px;background:rgba(0,229,255,.08);border:1px solid rgba(0,229,255,.35);overflow:hidden}
#fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--c2),var(--c1));box-shadow:0 0 16px var(--c1);
 -webkit-transition:width .5s ease;transition:width .5s ease}
#fill:after{content:"";position:absolute;left:0;top:0;right:0;bottom:0;background:repeating-linear-gradient(90deg,transparent 0,transparent 10px,rgba(0,0,0,.35) 10px,rgba(0,0,0,.35) 12px)}
#shine{position:absolute;top:0;bottom:0;width:120px;left:-120px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
 -webkit-animation:shine 2.2s linear infinite;animation:shine 2.2s linear infinite}
@-webkit-keyframes shine{to{left:110%}}
@keyframes shine{to{left:110%}}
#tip{position:absolute;left:0;right:0;bottom:40px;text-align:center;font-size:15px;opacity:.75;-webkit-transition:opacity .5s;transition:opacity .5s}
#tip b{color:var(--c1);font-family:'Exo2';font-weight:600;font-size:11px;letter-spacing:2px;margin-right:8px}

/* ---------- ПЛЕЕР ---------- */
#player{position:absolute;right:50px;top:46px;width:330px;padding:14px 16px;background:rgba(0,15,28,.6);border:1px solid rgba(0,229,255,.3);z-index:60;
 -webkit-clip-path:polygon(0 0,100% 0,100% 80%,94% 100%,0 100%);clip-path:polygon(0 0,100% 0,100% 80%,94% 100%,0 100%)}
#pHead{font-family:'Exo2';font-weight:600;font-size:10px;letter-spacing:3px;color:var(--c1);opacity:.8;margin-bottom:6px}
#eq{float:right;height:12px}
#eq i{display:inline-block;width:3px;height:12px;margin-left:2px;background:var(--c1);-webkit-transform-origin:bottom;transform-origin:bottom;
 -webkit-animation:eq .8s ease-in-out infinite alternate;animation:eq .8s ease-in-out infinite alternate}
#eq i:nth-child(2){-webkit-animation-delay:-.3s;animation-delay:-.3s}#eq i:nth-child(3){-webkit-animation-delay:-.6s;animation-delay:-.6s}
#eq i:nth-child(4){-webkit-animation-delay:-.15s;animation-delay:-.15s}#eq i:nth-child(5){-webkit-animation-delay:-.45s;animation-delay:-.45s}
#player.paused #eq i{-webkit-animation-play-state:paused;animation-play-state:paused}
@-webkit-keyframes eq{from{-webkit-transform:scaleY(.15)}to{-webkit-transform:scaleY(1)}}
@keyframes eq{from{transform:scaleY(.15)}to{transform:scaleY(1)}}
#track{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:10px}
#ctrls{overflow:hidden}
.btn{float:left;width:30px;height:26px;line-height:24px;text-align:center;margin-right:6px;border:1px solid rgba(0,229,255,.35);color:var(--c1);cursor:pointer;font-size:13px}
.btn:hover{background:rgba(0,229,255,.18)}
#vol{float:left;position:relative;width:128px;height:26px;margin-left:6px;cursor:pointer}
#volTrack{position:absolute;left:0;right:0;top:12px;height:3px;background:rgba(0,229,255,.2)}
#volFill{position:absolute;left:0;top:0;bottom:0;background:var(--c1);box-shadow:0 0 8px var(--c1)}
#volKnob{position:absolute;top:-5px;width:12px;height:12px;margin-left:-6px;background:#fff;box-shadow:0 0 8px var(--c1);-webkit-transform:rotate(45deg);transform:rotate(45deg)}
#volNum{float:right;font-family:'Orbitron';font-size:12px;line-height:26px;color:var(--c1);width:36px;text-align:right}
#keys{margin-top:8px;font-size:11px;opacity:.45}
</style>
</head>
<body>

<!-- ФОН -->
<div id="slides" class="abs"></div>
<div id="glow" class="abs"></div>
<div id="grid" class="abs"></div>
<div id="parts" class="abs"></div>
<div id="tint" class="abs"></div>

<!-- ОСНОВНОЙ ЭКРАН -->
<div id="main" class="abs">
 <div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>
 <div id="logo">
  <div id="lNexus">NEXUS</div>
  <div id="lReborn">REBORN</div>
  <div id="lName"></div>
 </div>
 <div id="chips">
  <span class="chip"><b>КАРТА</b><span id="cMap">—</span></span>
  <span class="chip"><b>РЕЖИМ</b><span id="cGm">—</span></span>
  <span class="chip"><b>СЛОТЫ</b><span id="cSlots">—</span></span>
 </div>
 <div id="load">
  <div id="loadTop"><div id="status">Подключение к серверу...</div><div id="pct">0%</div></div>
  <div id="bar"><div id="fill"></div><div id="shine"></div></div>
 </div>
 <div id="tip"></div>
</div>

<div id="player">
 <div id="pHead">СЕЙЧАС ИГРАЕТ <span id="eq"><i></i><i></i><i></i><i></i><i></i></span></div>
 <div id="track">—</div>
 <div id="ctrls">
  <div class="btn" id="bPrev">&#9664;&#9664;</div>
  <div class="btn" id="bPlay">&#10074;&#10074;</div>
  <div class="btn" id="bNext">&#9654;&#9654;</div>
  <div id="vol"><div id="volTrack"><div id="volFill"></div><div id="volKnob"></div></div></div>
  <div id="volNum">15</div>
 </div>
 <div id="keys">&#8593;&#8595; громкость · M — без звука · N — след. трек</div>
</div>

<!-- ИНТРО -->
<div id="intro" class="abs">
 <div id="iFlash" class="abs"></div>
 <div class="wrap">
  <div id="iNexus"></div>
  <div id="iLine"></div>
  <div id="iReborn">REBORN</div>
 </div>
</div>

<div id="scan" class="abs"></div>
<div id="scanbar" class="abs"></div>

<audio id="audio" preload="auto"></audio>

<script>
// ================= НАСТРОЙКИ =================
var DEFAULT_VOLUME = 0.15;      // 0..1
var INTRO_MS = 4600;           // длительность интро
var TRACKS = [
 {src:"music/track.ogg", name:"Yeat — If We Being Real (slowed + reverb)"}
];
var BACKGROUNDS = ["img/bg1.jpg","img/bg2.jpg","img/bg3.jpg","img/bg4.jpg","img/bg5.jpg","img/bg6.jpg","img/bg7.jpg","img/bg8.jpg"];
var TIPS = [
 "Уважай других игроков — это делает сервер лучше",
 "Нажми Q, чтобы открыть меню спавна",
 "Нашёл баг? Сообщи администрации",
 "Добро пожаловать в новую эру NEXUS",
 "Не ломай чужие постройки",
 "Пиши в чат, если нужна помощь"
];
// =============================================

function $(id){return document.getElementById(id);}

// ---- ИНТРО ----
(function(){
 var w="NEXUS",h="";
 for(var i=0;i<w.length;i++){var d=(0.15+i*0.13)+"s";h+='<span style="-webkit-animation-delay:'+d+';animation-delay:'+d+'">'+w.charAt(i)+'</span>';}
 $("iNexus").innerHTML=h;
 setTimeout(function(){$("intro").className="abs out";$("main").className="abs on";},INTRO_MS);
 setTimeout(function(){$("intro").style.display="none";},INTRO_MS+1300);
})();

// ---- СЛАЙДЫ ----
(function(){
 var box=$("slides"),els=[],cur=-1,order=BACKGROUNDS.slice().sort(function(){return Math.random()-.5;});
 for(var i=0;i<order.length;i++){var s=document.createElement("div");s.className="slide";s.style.backgroundImage="url("+order[i]+")";box.appendChild(s);els.push(s);}
 function next(){if(cur>=0)els[cur].className="slide";cur=(cur+1)%els.length;
  var e=els[cur];e.className="slide";void e.offsetWidth;e.className="slide on";}
 next();setInterval(next,8000);
})();

// ---- ЧАСТИЦЫ ----
(function(){var c=$("parts");for(var i=0;i<45;i++){var p=document.createElement("div");p.className="p";
 p.style.left=(Math.random()*100)+"%";p.style.top=(100+Math.random()*10)+"%";
 var s=(1+Math.random()*2.5)+"px";p.style.width=s;p.style.height=s;p.style.opacity=Math.random();
 var dur=(10+Math.random()*16)+"s",del=(-Math.random()*25)+"s";
 p.style.webkitAnimationDuration=dur;p.style.animationDuration=dur;p.style.webkitAnimationDelay=del;p.style.animationDelay=del;c.appendChild(p);}})();

// ---- ГЛИТЧ ЛОГО ----
setInterval(function(){var l=$("lNexus");l.className="";void l.offsetWidth;l.className="glitch";},4500);

// ---- СОВЕТЫ ----
(function(){var i=0;function t(){var el=$("tip");el.style.opacity=0;
 setTimeout(function(){el.innerHTML="<b>СОВЕТ</b>"+TIPS[i%TIPS.length];el.style.opacity=.75;i++;},500);}t();setInterval(t,6000);})();

// ---- МУЗЫКА ----
var audio=$("audio"),gmodVol=1,muted=false,ti=0;
var userVol=DEFAULT_VOLUME;
try{var sv=parseFloat(localStorage.getItem("nx_vol2"));if(!isNaN(sv))userVol=sv;}catch(e){}
var playlist=TRACKS.slice();

function applyVol(){
 var v=muted?0:userVol*gmodVol;audio.volume=Math.max(0,Math.min(1,v));
 var pc=Math.round(userVol*100);$("volFill").style.width=pc+"%";$("volKnob").style.left=pc+"%";
 $("volNum").innerHTML=muted?"OFF":pc;
 try{localStorage.setItem("nx_vol2",userVol);}catch(e){}
}
function load(i){ti=(i+playlist.length)%playlist.length;audio.src=playlist[ti].src;$("track").innerHTML=playlist[ti].name;play();}
function play(){try{var p=audio.play();if(p&&p["catch"])p["catch"](function(){});}catch(e){}$("player").className="";$("bPlay").innerHTML="&#10074;&#10074;";}
function pause(){audio.pause();$("player").className="paused";$("bPlay").innerHTML="&#9654;";}
audio.addEventListener("ended",function(){load(ti+1);});
audio.addEventListener("error",function(){setTimeout(function(){load(ti+1);},500);});
$("bNext").onclick=function(){load(ti+1);};
$("bPrev").onclick=function(){load(ti-1);};
$("bPlay").onclick=function(){audio.paused?play():pause();};
// ползунок громкости
(function(){var v=$("vol"),drag=false;
 function set(e){var r=v.getBoundingClientRect();userVol=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));muted=false;applyVol();}
 v.onmousedown=function(e){drag=true;set(e);};
 document.addEventListener("mousemove",function(e){if(drag)set(e);});
 document.addEventListener("mouseup",function(){drag=false;});
 v.addEventListener("mousewheel",function(e){userVol=Math.max(0,Math.min(1,userVol+(e.wheelDelta>0?.05:-.05)));applyVol();});
})();
document.addEventListener("keydown",function(e){
 var k=e.keyCode;
 if(k==38||k==107||k==187){userVol=Math.min(1,userVol+.05);muted=false;applyVol();}
 else if(k==40||k==109||k==189){userVol=Math.max(0,userVol-.05);applyVol();}
 else if(k==77){muted=!muted;applyVol();}
 else if(k==78){load(ti+1);}
 else if(k==32){audio.paused?play():pause();}
});
applyVol();load(0);
// если браузер заблокировал автозапуск — включим по первому клику
document.addEventListener("mousedown",function(){if(audio.paused&&$("player").className!="paused")play();});

// ---- ПРОГРЕСС ----
var total=0,needed=0,shown=0,target=3;
function setTarget(p){if(p>target)target=Math.min(100,p);}
setInterval(function(){
 if(target<70)target+=0.015;           // медленно ползём, пока сервер молчит
 shown+=(target-shown)*0.12;
 $("fill").style.width=shown+"%";$("pct").innerHTML=Math.floor(shown)+"%";
},50);
function setStatus(s){$("status").innerHTML=s;}

// ================= CALLBACKS GMOD =================
function GameDetails(servername,serverurl,mapname,maxplayers,steamid,gamemode,volume,language){
 if(servername)$("lName").innerHTML=servername;
 if(mapname)$("cMap").innerHTML=mapname;
 if(gamemode)$("cGm").innerHTML=gamemode;
 if(maxplayers)$("cSlots").innerHTML=maxplayers;
 if(typeof volume==="number"&&volume>=0){gmodVol=Math.min(1,volume);applyVol();}
 setTarget(8);
}
function SetFilesTotal(t){total=t;upd();}
function SetFilesNeeded(n){needed=n;upd();}
function DownloadingFile(f){setStatus("Загрузка: "+f.replace(/^.*[\\\/]/,""));}
function upd(){if(total>0)setTarget(10+(total-needed)/total*75);}
var STATUS_RU=[
 [/Retrieving server info/i,"Получение информации о сервере...",12],
 [/Workshop/i,"Загрузка контента из Мастерской...",20],
 [/Sending client info/i,"Отправка данных клиента...",90],
 [/Client info sent/i,"Данные отправлены",93],
 [/Lua/i,"Загрузка Lua-скриптов...",88],
 [/Starting Lua/i,"Запуск Lua...",95],
 [/Parsing game info/i,"Обработка игровой информации...",80],
 [/Precaching/i,"Предзагрузка ресурсов...",85],
 [/Mounting/i,"Подключение аддонов...",30],
 [/Loading/i,null,null]
];
function SetStatusChanged(s){

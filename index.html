<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Loading</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#07090f;font-family:"Segoe UI",Arial,sans-serif;color:#e8ecf5}
#bg{position:absolute;left:0;top:0;width:100%;height:100%;
 background:radial-gradient(ellipse at 20% 30%,rgba(60,110,255,.35),transparent 55%),radial-gradient(ellipse at 80% 70%,rgba(255,70,140,.28),transparent 55%),#07090f;
 -webkit-animation:hue 18s linear infinite;animation:hue 18s linear infinite}
@-webkit-keyframes hue{from{-webkit-filter:hue-rotate(0deg)}to{-webkit-filter:hue-rotate(360deg)}}
@keyframes hue{from{filter:hue-rotate(0deg)}to{filter:hue-rotate(360deg)}}
.dot{position:absolute;border-radius:50%;background:#fff;opacity:.5;-webkit-animation:fly linear infinite;animation:fly linear infinite}
@-webkit-keyframes fly{from{-webkit-transform:translateY(110vh)}to{-webkit-transform:translateY(-10vh)}}
@keyframes fly{from{transform:translateY(110vh)}to{transform:translateY(-10vh)}}
#center{position:absolute;left:0;right:0;top:32%;text-align:center}
#title{font-size:64px;font-weight:800;letter-spacing:4px;text-transform:uppercase;text-shadow:0 0 30px rgba(110,150,255,.8)}
#sub{margin-top:10px;font-size:20px;opacity:.75}
#info{margin-top:26px;font-size:16px;opacity:.85}
#info span{display:inline-block;margin:0 12px;padding:6px 14px;border:1px solid rgba(255,255,255,.18);border-radius:20px;background:rgba(255,255,255,.05)}
#bottom{position:absolute;left:8%;right:8%;bottom:70px}
#status{font-size:15px;margin-bottom:10px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar{height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
#fill{height:100%;width:0;background:linear-gradient(90deg,#4f7cff,#ff4f9a);-webkit-transition:width .4s;transition:width .4s}
#tip{position:absolute;left:0;right:0;bottom:24px;text-align:center;font-size:14px;opacity:.6}
#music{position:absolute;right:24px;top:20px;font-size:13px;opacity:.6}
</style>
</head>
<body>
<div id="bg"></div>
<div id="dots"></div>
<div id="music">&#9835; музика</div>
<div id="center">
 <div id="title">Мій сервер</div>
 <div id="sub">Ласкаво просимо, друже!</div>
 <div id="info"><span id="map">карта: ...</span><span id="gm">режим: ...</span><span id="slots">слотів: ...</span></div>
</div>
<div id="bottom">
 <div id="status">Підключення...</div>
 <div id="bar"><div id="fill"></div></div>
</div>
<div id="tip"></div>
<audio id="audio" src="music.ogg" loop autoplay></audio>
<script>
// ===== НАЛАШТУВАННЯ =====
var TITLE = "Мій сервер";
var SUBTITLE = "Ласкаво просимо, друже!";
var MUSIC_VOLUME = 0.35; // 0..1
var TIPS = [
 "Не ламай чужі будівлі :)",
 "Q - меню спавну, C - контекстне меню",
 "Пиши в чат, якщо щось не працює",
 "Карту зробив власник сервера"
];
// ========================
function $(id){return document.getElementById(id);}
$("title").innerHTML = TITLE; $("sub").innerHTML = SUBTITLE;

var audio = $("audio");
audio.volume = MUSIC_VOLUME;
try{ var p = audio.play(); if(p && p["catch"]) p["catch"](function(){}); }catch(e){}

// частинки
(function(){var c=$("dots");for(var i=0;i<40;i++){var d=document.createElement("div");d.className="dot";var s=1+Math.random()*3;
 d.style.width=s+"px";d.style.height=s+"px";d.style.left=(Math.random()*100)+"%";
 var dur=(8+Math.random()*14)+"s",del=(-Math.random()*20)+"s";
 d.style.webkitAnimationDuration=dur;d.style.animationDuration=dur;d.style.webkitAnimationDelay=del;d.style.animationDelay=del;c.appendChild(d);}})();

// поради
var tipI=0;function nextTip(){$("tip").innerHTML=TIPS[tipI%TIPS.length];tipI++;}nextTip();setInterval(nextTip,5000);

// ===== callbacks від GMod =====
var total=0, needed=0;
function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode, volume, language){
 if(servername) $("title").innerHTML = servername;
 $("map").innerHTML = "карта: " + mapname;
 $("gm").innerHTML = "режим: " + gamemode;
 $("slots").innerHTML = "слотів: " + maxplayers;
 if(typeof volume === "number" && volume >= 0) audio.volume = Math.min(1, volume * MUSIC_VOLUME * 2);
}
function SetFilesTotal(t){ total = t; upd(); }
function SetFilesNeeded(n){ needed = n; upd(); }
function DownloadingFile(f){ $("status").innerHTML = "Завантаження: " + f; }
function SetStatusChanged(s){ $("status").innerHTML = s; if(/Sending client info/i.test(s)) $("fill").style.width="100%"; }
function upd(){ if(total>0) $("fill").style.width = Math.max(0,Math.min(100,(total-needed)/total*100)) + "%"; }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>NEXUS REBORN</title>
<style>
@font-face{font-family:'Orbitron';font-weight:500;src:url(fonts/orbitron-500.ttf) format('truetype')}
@font-face{font-family:'Orbitron';font-weight:900;src:url(fonts/orbitron-900.ttf) format('truetype')}
@font-face{font-family:'Exo2';font-weight:400;src:url(fonts/exo2-400.ttf) format('truetype')}

html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#dff6ff;font-family:'Exo2',Arial,sans-serif;-webkit-user-select:none;user-select:none}
.abs{position:absolute;left:0;top:0;width:100%;height:100%}

/* фон */
.slide{position:absolute;left:-5%;top:-5%;width:110%;height:110%;background-size:cover;background-position:center;opacity:0;-webkit-transition:opacity 2.5s;transition:opacity 2.5s}
.slide.on{opacity:.45}
#tint{background:radial-gradient(ellipse at center,rgba(0,0,0,.2),rgba(0,0,0,.85) 80%)}

/* интро */
#intro{z-index:10;background:#000;text-align:center}
#intro.out{-webkit-transition:opacity 1s;transition:opacity 1s;opacity:0}
.mid{position:absolute;left:0;right:0;top:50%;-webkit-transform:translateY(-60%);transform:translateY(-60%);text-align:center}
.nexus{font-family:'Orbitron';font-weight:900;font-size:130px;letter-spacing:18px;padding-left:18px;color:#fff;line-height:1;text-shadow:0 0 25px rgba(0,229,255,.7)}
.reborn{font-family:'Orbitron';font-weight:500;font-size:28px;letter-spacing:18px;padding-left:18px;color:#00e5ff;margin-top:18px;text-shadow:0 0 12px #00e5ff}
#intro .nexus{opacity:0;-webkit-animation:fadeup 1.2s .2s ease forwards;animation:fadeup 1.2s .2s ease forwards}
#intro .reborn{opacity:0;letter-spacing:50px;-webkit-animation:spread 1.2s 1.3s ease forwards;animation:spread 1.2s 1.3s ease forwards}
@-webkit-keyframes fadeup{from{opacity:0;-webkit-transform:translateY(20px);-webkit-filter:blur(10px)}to{opacity:1;-webkit-transform:none;-webkit-filter:blur(0)}}
@keyframes fadeup{from{opacity:0;transform:translateY(20px);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@-webkit-keyframes spread{to{opacity:1;letter-spacing:18px}}
@keyframes spread{to{opacity:1;letter-spacing:18px}}

/* основной */
#main{opacity:0;-webkit-transition:opacity 1s;transition:opacity 1s}
#main.on{opacity:1}
#info{margin-top:24px;font-size:16px;opacity:.6;letter-spacing:1px}
#load{position:absolute;left:15%;right:15%;bottom:70px}
#status{font-size:14px;opacity:.7;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar{height:4px;background:rgba(255,255,255,.1)}
#fill{height:100%;width:0;background:#00e5ff;box-shadow:0 0 10px #00e5ff;-webkit-transition:width .4s;transition:width .4s}

/* звук */
#snd{position:absolute;right:30px;top:26px;z-index:20;font-size:13px;opacity:.7}
#snd:hover{opacity:1}
#mute{display:inline-block;cursor:pointer;width:20px;color:#00e5ff;vertical-align:middle}
#vol{display:inline-block;position:relative;width:110px;height:16px;vertical-align:middle;cursor:pointer}
#vol i{position:absolute;left:0;right:0;top:7px;height:2px;background:rgba(255,255,255,.2)}
#vol b{position:absolute;left:0;top:7px;height:2px;background:#00e5ff}
</style>
</head>
<body>

<div id="bg" class="abs"></div>
<div id="tint" class="abs"></div>

<div id="main" class="abs">
 <div class="mid">
  <div class="nexus">NEXUS</div>
  <div class="reborn">REBORN</div>
  <div id="info"></div>
 </div>
 <div id="load">
  <div id="status">Подключение...</div>
  <div id="bar"><div id="fill"></div></div>
 </div>
</div>

<div id="snd"><span id="mute">&#9835;</span> <span id="vol"><i></i><b></b></span></div>

<div id="intro" class="abs">
 <div class="mid">
  <div class="nexus">NEXUS</div>
  <div class="reborn">REBORN</div>
 </div>
</div>

<audio id="audio" src="music/track.ogg" loop autoplay></audio>

<script>
// ===== НАСТРОЙКИ =====
var DEFAULT_VOLUME = 0.15;   // 0..1
var INTRO_MS = 3500;
var BACKGROUNDS = ["img/bg1.jpg","img/bg2.jpg","img/bg3.jpg","img/bg4.jpg","img/bg5.jpg","img/bg6.jpg","img/bg7.jpg","img/bg8.jpg"];
// =====================

function $(id){return document.getElementById(id);}

// интро
setTimeout(function(){$("intro").className="abs out";$("main").className="abs on";},INTRO_MS);
setTimeout(function(){$("intro").style.display="none";},INTRO_MS+1100);

// фон
(function(){var els=[],cur=0;
 for(var i=0;i<BACKGROUNDS.length;i++){var s=document.createElement("div");s.className="slide";s.style.backgroundImage="url("+BACKGROUNDS[i]+")";$("bg").appendChild(s);els.push(s);}
 cur=Math.floor(Math.random()*els.length);els[cur].className="slide on";
 setInterval(function(){els[cur].className="slide";cur=(cur+1)%els.length;els[cur].className="slide on";},8000);
})();

// звук
var audio=$("audio"),vol=DEFAULT_VOLUME,muted=false,gvol=1;
try{var sv=parseFloat(localStorage.getItem("nx_vol3"));if(!isNaN(sv))vol=sv;}catch(e){}
function applyVol(){audio.volume=muted?0:Math.min(1,vol*gvol);
 $("vol").getElementsByTagName("b")[0].style.width=(vol*100)+"%";$("mute").style.opacity=muted?.3:1;
 try{localStorage.setItem("nx_vol3",vol);}catch(e){}}
function play(){try{var p=audio.play();if(p&&p["catch"])p["catch"](function(){});}catch(e){}}
$("mute").onclick=function(){muted=!muted;applyVol();};
(function(){var v=$("vol"),drag=false;
 function set(e){var r=v.getBoundingClientRect();vol=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));muted=false;applyVol();}
 v.onmousedown=function(e){drag=true;set(e);};
 document.addEventListener("mousemove",function(e){if(drag)set(e);});
 document.addEventListener("mouseup",function(){drag=false;});
})();
document.addEventListener("keydown",function(e){
 if(e.keyCode==38){vol=Math.min(1,vol+.05);applyVol();}
 if(e.keyCode==40){vol=Math.max(0,vol-.05);applyVol();}
 if(e.keyCode==77){muted=!muted;applyVol();}
});
document.addEventListener("mousedown",function(){if(audio.paused)play();});
applyVol();play();

// ===== GMod =====
var total=0,needed=0;
function GameDetails(servername,serverurl,mapname,maxplayers,steamid,gamemode,volume){
 $("info").innerHTML=[mapname,gamemode,maxplayers?maxplayers+" слотов":""].join(" &nbsp;·&nbsp; ");
 if(typeof volume==="number"&&volume>=0){gvol=Math.min(1,volume);applyVol();}
}
function SetFilesTotal(t){total=t;upd();}
function SetFilesNeeded(n){needed=n;upd();}
function upd(){if(total>0)$("fill").style.width=((total-needed)/total*100)+"%";}
function DownloadingFile(f){$("status").innerHTML="Загрузка: "+f.replace(/^.*[\\\/]/,"");}
function SetStatusChanged(s){$("status").innerHTML=s;if(/Sending client info/i.test(s))$("fill").style.width="100%";}
</script>
</body>
</html>
